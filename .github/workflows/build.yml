name: Build

on:
  push:
  pull_request:

jobs:
  psp:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: psp-cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: EBOOT
          path: build/EBOOT.PBP
